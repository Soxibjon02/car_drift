<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  
  <!-- SEO & Social Media Metadata -->
  <title>DRIFTVERSE — Premium Automotive Video & Performance Car Platform</title>
  <meta name="description" content="DRIFTVERSE is an editorial automotive video and car discovery platform. Experience midnight drift runs, side-by-side performance telemetry, and curated high-end supercars and JDM icons.">
  <meta name="keywords" content="automotive platform, supercar, hypercar, JDM, drag race, racing telemetry, car specifications, BMW M4, Porsche 911 GT3, Nissan GT-R">
  <meta name="author" content="DRIFTVERSE Automotive Media">
  <meta name="theme-color" content="#FF4D00">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://driftverse.io/">
  <meta property="og:title" content="DRIFTVERSE — The World of Performance Cars in Motion">
  <meta property="og:description" content="The definitive automotive media platform for drift runs, supercars, and head-to-head racing telemetry.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=1200&q=80">

  <!-- Twitter Card -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="DRIFTVERSE — Premium Automotive Media">
  <meta property="twitter:description" content="High-octane car discovery, performance telemetry and 4K automotive footage.">
  <meta property="twitter:image" content="https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=1200&q=80">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Progressive Web App (PWA) Metadata -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DRIFTVERSE">
  <meta name="application-name" content="DRIFTVERSE">

  <!-- Refined Design System Stylesheets (Ordered Architecture) -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
</head>
<body>

  <!-- Cinematic Loading Screen -->
  <div id="loading-screen" aria-label="Loading DRIFTVERSE" role="progressbar">
    <div class="loader-tachometer">
      <div class="loader-ring"></div>
    </div>
    <div class="loader-brand">DRIFTVERSE</div>
    <div class="loader-subtitle">INITIALIZING PERFORMANCE TELEMETRY...</div>
  </div>

  <!-- Sticky Desktop & Mobile Navigation Mount -->
  <div id="navbar-mount"></div>

  <!-- Primary Dynamic Page Route Container -->
  <main id="page-mount" role="main"></main>

  <!-- Final Scene Cinematic Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Global Toast Notification Feed -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Master Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
