<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181C" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF2A00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF4D00" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#26262B" stroke-width="4" />
  
  <!-- Subtle Carbon Pattern Lines -->
  <line x1="32" y1="480" x2="480" y2="32" stroke="rgba(255,255,255,0.02)" stroke-width="2" />
  <line x1="96" y1="480" x2="480" y2="96" stroke="rgba(255,255,255,0.02)" stroke-width="2" />
  
  <!-- Iconic Dynamic Chevron Vector -->
  <g filter="url(#glow)">
    <polygon points="256,92 416,368 344,368 256,216 168,368 96,368" fill="url(#accentGrad)" />
  </g>
  
  <!-- Core Telemetry Slash -->
  <polygon points="256,260 296,336 216,336" fill="#FFFFFF" opacity="0.9" />

  <!-- Speed Dash lines -->
  <rect x="180" y="408" width="152" height="8" rx="4" fill="#FF4D00" opacity="0.8" />
  <rect x="216" y="428" width="80" height="4" rx="2" fill="#FFFFFF" opacity="0.4" />
</svg>
